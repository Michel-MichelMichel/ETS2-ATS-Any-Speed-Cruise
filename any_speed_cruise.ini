; Any Speed Cruise Control - configuration
; This file must sit next to any_speed_cruise.dll (bin\win_x64\plugins).
; Changes are read when the game starts.

[keys]
; Easiest way: run any_speed_cruise_config.exe (same folder), click Change
; and press the key or button. It fills in the values below.
;
; Each value must be the control bound to the same function in the game
; (Options > Keys & Buttons). The plugin only watches it, the game still
; receives it.
;   Keyboard key: Windows virtual-key code, decimal or hexadecimal (0x..)
;     0x6E numpad .   0x6A numpad *   0x6B numpad +   0x6D numpad -   0x43 C
;     List: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
;     Numpad keys only have these codes while Num Lock is ON.
;   Wheel / gamepad button: joy<device>.b<button>, e.g. joy1.b5
;     (devices 1-16, buttons 1-32)
set      = 0x6E
resume   = 0x6A
increase = 0x6B
decrease = 0x6D

[cruise]
; Step of the increase / decrease keys while the plugin holds the speed.
step_kmh = 5

; Speed at which the game's own cruise control is asked to take over.
; 0 = automatic (30.5 km/h in ETS2, 32.8 km/h in ATS).
handover_kmh = 0

; Maximum throttle the plugin may apply (0.1 - 1.0). Lower = gentler starts.
max_throttle = 1.0

; "Set" is ignored below this speed (a standing truck has no speed to hold).
min_set_speed_kmh = 2

; 1 = write state changes to game.log.txt
log = 1
